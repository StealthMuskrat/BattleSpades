name: Java 25 migration verification
on:
  push:
    branches: [port/java25]
    paths: ['java/**', '.github/workflows/java25.yml']
  pull_request:
    paths: ['java/**', '.github/workflows/java25.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify migration components
        working-directory: java
        run: ./gradlew --no-daemon clean check build
      - name: Core configuration smoke test
        run: java -jar java/build/libs/BattleSpades.jar --check-config config.toml
      - name: Verify reproducible application archive
        run: |
          cp java/build/libs/BattleSpades.jar "$RUNNER_TEMP/BattleSpades-first.jar"
          cd java
          ./gradlew --no-daemon jar --rerun-tasks
          cmp build/libs/BattleSpades.jar "$RUNNER_TEMP/BattleSpades-first.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: BattleSpades-java25
          path: java/build/libs/BattleSpades.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java25-build-results
          path: |
            java/build/test-results
            java/build/reports/tests
  platform:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: BattleSpades-java25
          path: same-artifact
      - name: Run identical application artifact
        shell: bash
        run: |
          java -jar same-artifact/BattleSpades.jar --version
          java -jar same-artifact/BattleSpades.jar --check-config config.toml
      - name: Component tests on platform
        shell: bash
        working-directory: java
        run: ./gradlew --no-daemon test integrationTest verifyPortable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java25-results-${{ matrix.os }}
          path: |
            java/build/test-results
            java/build/reports/tests
  native-enet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Java transport probe
        working-directory: java
        run: ./gradlew --no-daemon integrationTestClasses jar
      - name: Build development-only native ENet oracle
        run: |
          python -m pip install Cython==3.0.12 setuptools==80.9.0
          python java/tools/build_reference_enet.py
      - name: Native interoperability with loss, reorder, duplicates and reconnect
        timeout-minutes: 5
        run: python java/tools/test_native_transport.py
      - name: Native application loader, password, live catch-up and scene reload
        timeout-minutes: 5
        run: python java/tools/test_native_loader.py
      - name: Rebuild original world and scene oracles and reproduce fixtures
        run: |
          python java/tools/build_reference_world.py --domain
          python java/tools/generate_movement_golden.py
          python java/tools/generate_query_golden.py
          python -S java/tools/export_domain_catalogs.py
          python -S java/tools/generate_scene_golden.py
          python -S java/tools/export_name_unicode.py
          python -S java/tools/generate_admission_golden.py
          python -S java/tools/generate_spawn_golden.py
          python -S java/tools/export_map_catalog.py
          python -S java/tools/generate_metadata_golden.py
          python -S java/tools/export_life_catalog.py
          python -S java/tools/generate_life_golden.py
          python -S java/tools/generate_health_golden.py
          python -S java/tools/generate_input_golden.py
          python -S java/tools/generate_action_clock_golden.py
          python -S java/tools/generate_simulation_golden.py
          python -S java/tools/generate_flight_golden.py
          python -S java/tools/generate_owner_golden.py
          python -S java/tools/generate_snapshot_holds_golden.py
          python -S java/tools/generate_replication_golden.py
          python -S java/tools/generate_replication_wire_golden.py
          python -S java/tools/generate_player_snapshot_golden.py
          python -S java/tools/export_combat_catalog.py
          python -S java/tools/generate_lag_golden.py
          python -S java/tools/generate_lag_connected_golden.py
          python -S java/tools/generate_shoot_golden.py
          python -S java/tools/generate_fire_golden.py
          python -S java/tools/generate_pellet_golden.py
          python -S java/tools/export_hitboxes.py
          python -S java/tools/generate_combat_geometry_golden.py
          python -S java/tools/generate_shot_validation_golden.py
          python -S java/tools/generate_firing_patterns_golden.py
          python -S java/tools/generate_hit_trace_golden.py
          python -S java/tools/generate_combat_ray_golden.py
          python -S java/tools/export_direct_damage_catalog.py
          python -S java/tools/generate_direct_damage_golden.py
          python -S java/tools/generate_shield_golden.py
          python -S java/tools/generate_hit_effect_packets_golden.py
          python -S java/tools/generate_player_hit_effects_golden.py
          python -S java/tools/generate_melee_hit_effects_golden.py
          python -S java/tools/generate_shot_tally_golden.py
          python -S java/tools/generate_combat_commit_golden.py
          git diff --exit-code -- java/src/main/resources/net/battlespades/catalog/direct-damage.toml java/src/test/resources/golden/direct-damage-* java/src/test/resources/golden/shield-* java/src/test/resources/golden/hit-effect-packets* java/src/test/resources/golden/player-hit-effects* java/src/test/resources/golden/melee-hit-effects* java/src/test/resources/golden/shot-tally* java/src/test/resources/golden/combat-commit*
          git diff --exit-code -- java/src/main/resources/net/battlespades/catalog/hitboxes.toml java/src/test/resources/golden/combat-geometry-* java/src/test/resources/golden/shot-validation-* java/src/test/resources/golden/firing-patterns* java/src/test/resources/golden/hit-trace* java/src/test/resources/golden/combat-ray*
          git diff --exit-code -- java/src/main/resources/net/battlespades/catalog/combat.toml java/src/test/resources/golden/lag-history.tsv.gz java/src/test/resources/golden/lag-history-provenance.json java/src/test/resources/golden/lag-decisions.tsv.gz java/src/test/resources/golden/lag-decisions-provenance.json java/src/test/resources/golden/lag-connected.tsv.gz java/src/test/resources/golden/lag-connected-provenance.json java/src/test/resources/golden/shoot.tsv.gz java/src/test/resources/golden/shoot-provenance.json java/src/test/resources/golden/player-fire.tsv.gz java/src/test/resources/golden/player-fire-provenance.json java/src/test/resources/golden/pellets.tsv.gz java/src/test/resources/golden/pellets-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/owner-history.tsv.gz java/src/test/resources/golden/owner-provenance.json java/src/test/resources/golden/snapshot-holds.tsv.gz java/src/test/resources/golden/snapshot-holds-provenance.json java/src/test/resources/golden/replication.tsv.gz java/src/test/resources/golden/replication-provenance.json java/src/test/resources/golden/replication-wire.tsv.gz java/src/test/resources/golden/replication-wire-provenance.json java/src/test/resources/golden/player-snapshot.tsv.gz java/src/test/resources/golden/player-snapshot-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/flight-simulation java/src/test/resources/golden/flight-impact.tsv.gz java/src/test/resources/golden/flight-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/infantry-simulation.tsv.gz java/src/test/resources/golden/infantry-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/action-clock.tsv.gz java/src/test/resources/golden/action-clock-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/input-timeline.tsv.gz java/src/test/resources/golden/input-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/health-damage.tsv.gz java/src/test/resources/golden/health-healing.tsv.gz java/src/test/resources/golden/health-traces.tsv.gz java/src/test/resources/golden/health-attribution.tsv.gz java/src/test/resources/golden/health-provenance.json
          git diff --exit-code -- java/src/main/resources/net/battlespades/catalog/life.toml java/src/test/resources/golden/life-spawn.tsv.gz java/src/test/resources/golden/life-inventory.tsv.gz java/src/test/resources/golden/life-killfeed.tsv.gz java/src/test/resources/golden/life-packets.tsv.gz java/src/test/resources/golden/life-runtime.tsv.gz java/src/test/resources/golden/life-roster.tsv.gz java/src/test/resources/golden/life-provenance.json
          git diff --exit-code -- java/src/main/resources/net/battlespades/catalog/map-metadata.toml java/src/test/resources/golden/metadata-inputs.tsv.gz java/src/test/resources/golden/metadata-results.tsv.gz java/src/test/resources/golden/metadata-packets.tsv.gz java/src/test/resources/golden/metadata-pools.tsv.gz java/src/test/resources/golden/metadata-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/spawn-layouts.tsv.gz java/src/test/resources/golden/spawn-geometry.tsv.gz java/src/test/resources/golden/spawn-events.tsv.gz java/src/test/resources/golden/spawn-random.tsv.gz java/src/test/resources/golden/spawn-hypot.tsv.gz java/src/test/resources/golden/spawn-sums.tsv.gz java/src/test/resources/golden/spawn-settle.tsv.gz java/src/test/resources/golden/spawn-provenance.json
          git diff --exit-code -- java/src/test/resources/golden/name-unicode.tsv.gz java/src/test/resources/golden/names.tsv.gz java/src/test/resources/golden/admission-teams.tsv.gz java/src/test/resources/golden/admission-classes.tsv.gz java/src/test/resources/golden/admission-provenance.json java/src/main/resources/net/battlespades/player/name-unicode.bin.gz
          git diff --exit-code -- java/src/test/resources/golden/movement.tsv.gz java/src/test/resources/golden/movement-provenance.json java/src/test/resources/golden/queries.tsv.gz java/src/test/resources/golden/query-cells.tsv java/src/test/resources/golden/rules.tsv java/src/test/resources/golden/selections.tsv java/src/test/resources/golden/rule-movement.tsv java/src/test/resources/golden/scene-builders.tsv java/src/test/resources/golden/skyboxes.tsv java/src/main/resources/net/battlespades/catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-enet-results
          path: |
            java/docs/native-transport-results.json
            java/docs/native-loader-results.json
