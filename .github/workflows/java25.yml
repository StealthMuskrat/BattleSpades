name: Java 25 migration verification
on:
  push:
    branches: [port/java25]
    paths: ['java/**', '.github/workflows/java25.yml']
  pull_request:
    paths: ['java/**', '.github/workflows/java25.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify migration components
        working-directory: java
        run: ./gradlew --no-daemon clean check build
      - name: Core configuration smoke test
        run: java -jar java/build/libs/BattleSpades.jar --check-config config.toml
      - uses: actions/upload-artifact@v4
        with:
          name: BattleSpades-java25
          path: java/build/libs/BattleSpades.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java25-build-results
          path: |
            java/build/test-results
            java/build/reports/tests
  platform:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: BattleSpades-java25
          path: same-artifact
      - name: Run identical application artifact
        shell: bash
        run: |
          java -jar same-artifact/BattleSpades.jar --version
          java -jar same-artifact/BattleSpades.jar --check-config config.toml
      - name: Component tests on platform
        shell: bash
        working-directory: java
        run: ./gradlew --no-daemon test integrationTest verifyPortable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java25-results-${{ matrix.os }}
          path: |
            java/build/test-results
            java/build/reports/tests
