objective = "Survivors fortify together; infected breach and convert survivors."
posture = "survive"

[[strategies]]
code = "vip"
objective = "Protect the friendly VIP and coordinate attacks on the enemy VIP."
posture = "escort"

[[strategies]]
code = "mh"
objective = "Capture the active hill, then hold its approaches."
posture = "defend"

[[strategies]]
code = "dem"
objective = "Fortify the friendly objective and destroy the opposing objective."
posture = "build"

[[strategies]]
code = "tc"
objective = "Capture connected territories while retaining a defensive line."
posture = "assault"

[[strategies]]
code = "dia"
objective = "Mine, collect, escort, and cash in diamonds at active drop-offs."
posture = "mine"

[[strategies]]
code = "oc"
objective = "Deliver bombs as Blue; intercept and dispose of them as Green."
posture = "escort"

[[strategies]]
code = "tut"
objective = "Remain passive so authored player lessons are not disturbed."
posture = "survive"

[[strategies]]
code = "ugc"
objective = "Remain passive while players author and validate map objectives."
posture = "survive"

[[strategies]]
code = "block_hunt"
objective = "Hiders: E samples colour, fire disguises (unlimited); shovel digs but cannot hurt players. Hunters find everyone."
posture = "balanced"

[[strategies]]
code = "false_wall"
objective = "Hide your cache with /stash, build decoys, then carry the enemy cache back to YOUR base."
posture = "balanced"

[[strategies]]
code = "crumbling_run"
objective = "Touch checkpoints in order. Platforms crumble behind you; /retry returns to your checkpoint."
posture = "balanced"

[[strategies]]
code = "last_exit"
objective = "Collect valuables and hold the announced exit to extract. Only extracted loot scores."
posture = "balanced"

[[strategies]]
code = "night_shift"
objective = "Clear six enemy waves, then reach evacuation. Repair the yellow barricade for a team resupply between waves."
posture = "balanced"

[[strategies]]
code = "tunnel_rats"
objective = "Dig through the bunker and bring two underground caches back to your base."
posture = "balanced"

[[strategies]]
code = "bridge_chicken"
objective = "Build across the gap and deliver your relay to the far island. Falling drops your relay."
posture = "balanced"

[[strategies]]
code = "towerfall"
objective = "Build around your tower, then destroy enemy supports. A falling core loses the round."
posture = "balanced"

[[strategies]]
code = "floor_tax"
objective = "Hold shovel fire to cut the floor. Grenades knock players back. Fall through three floors and you are out; last survivor wins."
posture = "balanced"

[[strategies]]
code = "hot_potato"
objective = "Melee-tag another player to pass the cursed intel. The fuse costs a life; three lives each."
posture = "balanced"

[[strategies]]
code = "lockdown"
objective = "Defeated players respawn in jail. Hold the enemy jail's rescue marker to free your team."
posture = "balanced"

[[strategies]]
code = "paint_raid"
objective = "Use your block tool to paint the marked floor. Most team-coloured cells at the bell wins."
posture = "balanced"

[[strategies]]
code = "smugglers_run"
objective = "Smugglers carry hidden packages to delivery points; guards intercept. Roles alternate."
posture = "balanced"

[[strategies]]
code = "one_in_the_spade"
objective = "One lethal shot. A kill earns another; when empty use your spade. First to 15 wins."
posture = "balanced"

[[strategies]]
code = "borrowed_arsenal"
objective = "Earn two kills with each weapon to advance. Finish the weapon ladder to win; death keeps your progress."
posture = "balanced"

[[strategies]]
code = "reverse_siege"
objective = "The surrounded team must carry supplies out of its fortress. Defenders intercept; roles alternate."
posture = "balanced"

[[strategies]]
code = "kingmaker"
objective = "Hold the marked hill uncontested to score for your team. First to 90 points wins."
posture = "balanced"

[[strategies]]
code = "red_light_raid"
objective = "Race through checkpoints. Freeze on RED; moving resets you. /retry returns to your checkpoint."
posture = "balanced"

[[strategies]]
code = "scrapyard_engineers"
objective = "Collect central scrap to fund construction. Destroy the enemy generator while protecting yours."
posture = "balanced"

[[strategies]]
code = "spadeball"
objective = "Carry or throw the intel into the opposing goal. Spades only; first to five goals wins."
posture = "balanced"

